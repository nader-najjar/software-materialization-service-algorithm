name: Notify Service

env:
  SERVICE_OWNER: ""
  SERVICE_REPOSITORY: ""
  PIPELINE_REPOSITORY: ""
  SERVICE_REF: main

on:
  push:
    branches: []

permissions: {}

jobs:
  notify-service:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Create Dispatch Token
        id: dispatch-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ""
          private-key: ""
          owner: ${{ env.SERVICE_OWNER }}
          repositories: ${{ env.SERVICE_REPOSITORY }}
          permission-actions: write

      - name: Notify Service
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        run: gh workflow run materialize-software.yml --repo "$SERVICE_OWNER/$SERVICE_REPOSITORY" --ref "$SERVICE_REF" --raw-field "pipelineRepository=$PIPELINE_REPOSITORY" --field "pushEvent=@$GITHUB_EVENT_PATH"
