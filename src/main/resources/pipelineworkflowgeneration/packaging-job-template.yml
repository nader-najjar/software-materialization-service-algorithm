name: ""
strategy:
  fail-fast: false
  matrix:
    include: []
runs-on: ${{ matrix.runner }}
env:
  CLIENT_ID_VARIABLE: ""
  PRIVATE_KEY_SECRET: ""
  GHCR_USERNAME: ""
  GHCR_PAT_SECRET: ""
steps:
  - name: Reject Manual Retries
    uses: $/.github/actions/reject-manual-retries

  - name: Set Release Name
    run: |
      repo='${{ matrix.repositoryName }}'
      echo "RELEASE_NAME=${repo/\//--}--${{ matrix.platform }}--${{ matrix.commitSHA }}" >> "$GITHUB_ENV"

  - name: Set Repository Owner
    run: |
      repo='${{ matrix.repositoryName }}'
      echo "REPOSITORY_OWNER=${repo%%/*}" >> "$GITHUB_ENV"

  - name: Create Repository Token
    id: create-repository-token
    uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
    with:
      client-id: ${{ vars[env.CLIENT_ID_VARIABLE] }}
      private-key: ${{ secrets[env.PRIVATE_KEY_SECRET] }}
      owner: ${{ env.REPOSITORY_OWNER }}
      repositories: ${{ matrix.repositoryName }}
      permission-contents: read

  - name: Download and Extract Release
    shell: bash
    env:
      GH_TOKEN: ${{ steps.create-repository-token.outputs.token }}
    run: |
      gh release download "$RELEASE_NAME" \
        --repo "${{ matrix.repositoryName }}" \
        --pattern "$RELEASE_NAME.tar.gz" \
        --dir "$RUNNER_TEMP"
      mkdir -p "$RUNNER_TEMP/oci-package"
      tar -xzf "$RUNNER_TEMP/$RELEASE_NAME.tar.gz" -C "$RUNNER_TEMP/oci-package"

  - name: Set Up Docker
    uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
    with:
      version: v29.10.0

  - name: Set Up Buildx
    uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    with:
      version: v0.39.0
      driver: docker

  - name: Log In to GHCR
    shell: bash
    env:
      GHCR_TOKEN: ${{ secrets[env.GHCR_PAT_SECRET] }}
    run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

  - name: Build and Push Image
    shell: bash
    run: |
      repo='${{ matrix.repositoryName }}'
      image="ghcr.io/${repo,,}:$RELEASE_NAME"
      docker build "$RUNNER_TEMP/oci-package" \
        --tag "$image" \
        --label "org.opencontainers.image.source=https://github.com/$repo"
      docker push "$image"
